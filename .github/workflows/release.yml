name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (type it with a leading v, e.g. v0.2.0 — bare 0.2.0 also works). Ignored when the job was triggered by pushing a git tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify (typecheck + build)
    # Run on PRs, any workflow push (main + tags — see workflow `on:`), and manual release prep.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  linux-release:
    name: Linux AppImage + publish
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Tag push: use ref (v1.2.3). Manual “Run workflow”: use required input (e.g. v0.2.0).
      - name: Sync root version from tag or workflow input
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: node scripts/set-root-version.mjs

      - name: Apply GitHub publish config for electron-updater
        run: node scripts/apply-github-publish.mjs
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}

      - run: npm ci

      - name: Build and publish to GitHub Releases
        run: |
          node -e "console.log('Publishing version', require('./package.json').version)"
          npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow uploading to an existing release older than 2h (electron-builder otherwise skips).
          EP_GH_IGNORE_TIME: true

      - name: Generate AppImage SHA256 checksums
        working-directory: release
        run: |
          ls -la .
          for f in *.AppImage; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la *.sha256

      - name: Upload checksums to GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          # `electron-builder` creates releases/tags like `v0.1.0`. When this workflow
          # is triggered manually, the input may be `0.1.0`, so normalize here.
          RELEASE_TAG="v${RELEASE_VERSION#v}"
          gh release upload "$RELEASE_TAG" *.AppImage.sha256 --clobber
